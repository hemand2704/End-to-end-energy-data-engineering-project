[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-consumption-data-engineering"
version = "1.0.0"
description = "Energy time-series data engineering portfolio project"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
